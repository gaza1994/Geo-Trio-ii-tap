# Stage 1: raw capture only. Logs every frame from the Trio II's J8 TX pad as hex,
# so you can confirm the wiring and record your own data before using the full firmware.
# Each frame appears in the ESPHome log as:  <<< 01 80 02 ... 03
# Save the log and decode it with: python3 tools/decode_log.py your-log.txt
esphome:
  name: geo-trio-tap
  friendly_name: Geo Trio Tap

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0          # keep the C3's own UART free

api:
  encryption:
    key: !secret geo_trio_api_key

ota:
  - platform: esphome
    password: !secret geo_trio_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Geo-Trio-Tap Fallback"
    password: !secret geo_trio_fallback_password

uart:
  id: trio_uart
  rx_pin: GPIO20        # J8 pin 1 (Zigbee chip TX). Nothing is connected to TX.
  baud_rate: 115200
  rx_buffer_size: 2048
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: [0x03]  # NXP frames end with 0x03
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');
